name: AetherGrid Direct-Drime OS Boot

on:
  workflow_dispatch:

jobs:
  boot-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 Hours Hard Limit

    env:
      NB_SK: ${{ secrets.NB_SK }}
      DRIME: ${{ secrets.DRIME }}

    steps:
      - name: Install Core Dependencies (QEMU, Rclone, NetBird)
        run: |
          echo "[LOG] WHAT: DEPENDENCY_INSTALL_STARTED | WHICH: QEMU, Rclone, NetBird | WHEN: $(date +%s%N)"
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils rclone util-linux
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          echo "[LOG] WHAT: NETBIRD_BINARY_INSTALLED | WHICH: NetBird Client | WHEN: $(date +%s%N)"

      - name: Initialize NetBird Mesh (Via NB_SK)
        run: |
          echo "[LOG] WHAT: SECRET_INJECTION_SUCCESS | WHICH: NB_SK | VALUE: [REDACTED] | WHEN: $(date +%s%N)"
          sudo netbird up --setup-key "$NB_SK" --log-level debug &
          sleep 10
          echo "[LOG] WHAT: P2P_TUNNEL_ESTABLISHED | WHICH: wt0 | WHEN: $(date +%s%N)"

      - name: Create RAM Disk (Strict Zero Local Storage)
        run: |
          echo "[LOG] WHAT: RAM_DISK_CREATED | WHICH: /ramdisk (14GB tmpfs) | WHEN: $(date +%s%N)"
          sudo mkdir -p /ramdisk
          sudo mount -t tmpfs -o size=14G tmpfs /ramdisk
          sudo mkdir -p /ramdisk/rclone_cache

      - name: Download Ubuntu 26.04 LTS ISO to RAM
        run: |
          echo "[LOG] WHAT: ISO_DOWNLOAD_STARTED | WHICH: Ubuntu 26.04 LTS | WHEN: $(date +%s%N)"
          wget -O /ramdisk/ubuntu.iso "https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso" || wget -O /ramdisk/ubuntu.iso "https://releases.ubuntu.com/noble/ubuntu-24.04.1-live-server-amd64.iso"
          echo "[LOG] WHAT: ISO_DOWNLOAD_COMPLETE | WHICH: /ramdisk/ubuntu.iso | WHEN: $(date +%s%N)"

      - name: Mount Drime Direct (Zero Local Storage)
        run: |
          echo "[LOG] WHAT: DRIME_SECRET_LOADED | WHICH: DRIME | VALUE: [REDACTED] | WHEN: $(date +%s%N)"
          sudo mkdir -p /mnt/drime
          # Mount Drime. Cache is strictly in RAM disk to prevent local disk usage.
          rclone mount :drime,token=${DRIME}: /mnt/drime --vfs-cache-mode writes --cache-dir /ramdisk/rclone_cache --allow-other --daemon
          sleep 5
          echo "[LOG] WHAT: DRIME_MOUNTED | WHICH: /mnt/drime | WHEN: $(date +%s%N)"

      - name: Create Direct Block Device on Drime
        run: |
          echo "[LOG] WHAT: SPARSE_IMAGE_CREATION | WHICH: /mnt/drime/ubuntu_root.img (100GB) | WHEN: $(date +%s%N)"
          # Create a 100GB sparse file directly on the Drime mount
          qemu-img create -f raw /mnt/drime/ubuntu_root.img 100G
          
          # Map it to a loop device so QEMU sees it as a real physical hard drive (/dev/sda)
          sudo losetup -fP /mnt/drime/ubuntu_root.img
          LOOP_DEV=$(losetup -a | grep ubuntu_root.img | cut -d: -f1)
          echo "LOOP_DEVICE=$LOOP_DEV" >> $GITHUB_ENV
          echo "[LOG] WHAT: LOOP_DEVICE_MAPPED | WHICH: $LOOP_DEV -> Drime | WHEN: $(date +%s%N)"

      - name: Launch QEMU VM & Expose VNC (0.0.0.0:5900)
        run: |
          echo "[LOG] WHAT: QEMU_BOOT_INITIATED | WHICH: Ubuntu ISO + Drime Block Device | WHEN: $(date +%s%N)"
          
          # Launch QEMU
          # -m 12288 (12GB RAM for VM, leaves 4GB for host/RAM disk)
          # -smp 4 (Uses all 4 threads)
          # -hda $LOOP_DEV (Installs OS directly to Drime)
          # -vnc 0.0.0.0:0 (Binds to 0.0.0.0:5900)
          sudo qemu-system-x86_64 \
            -m 12288 \
            -smp 4 \
            -accel kvm -accel tcg \
            -cpu host \
            -boot d \
            -cdrom /ramdisk/ubuntu.iso \
            -hda ${{ env.LOOP_DEV }} \
            -vnc 0.0.0.0:0 \
            -display none \
            -daemonize
            
          echo "[LOG] WHAT: VNC_BIND_ALL_INTERFACES | WHICH: 0.0.0.0:5900 | WHEN: $(date +%s%N)"
          echo "[LOG] WHAT: VM_LAUNCHED | WHICH: Connect via NetBird IP:5900 | WHEN: $(date +%s%N)"

      - name: 6-Hour Keep-Alive & Telemetry
        run: |
          echo "[LOG] WHAT: KEEP_ALIVE_LOOP_STARTED | WHICH: 6 Hours | WHEN: $(date +%s%N)"
          for i in $(seq 1 21600); do
            sleep 1
            if [ $((i % 300)) -eq 0 ]; then
              echo "[LOG] WHAT: CI_STEALTH_HEARTBEAT | WHICH: Uptime: $((i/60))m | WHEN: $(date +%s%N)"
            fi
          done
