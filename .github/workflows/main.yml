name: AetherGrid AIO Drime VM v10

on:
  workflow_dispatch:

jobs:
  boot-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      NB_SK: ${{ secrets.NB_SK }}
      DRIME: ${{ secrets.DRIME }}

    steps:
      - name: Install Minimal Core Stack
        run: |
          set -e
          echo "[LOG] WHAT: INSTALL_START | WHICH: Minimal QEMU/Rclone/NetBird Stack | WHEN: $(date +%s%N)"

          sudo apt-get update -y

          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            qemu-system-common \
            fuse3 \
            wget \
            curl \
            ca-certificates

          echo "[LOG] WHAT: RCLONE_INSTALL_START | WHEN: $(date +%s%N)"
          curl https://rclone.org/install.sh | sudo bash

          echo "[LOG] WHAT: NETBIRD_INSTALL_START | WHEN: $(date +%s%N)"
          curl -fsSL https://pkgs.netbird.io/install.sh | sh

          echo "[LOG] WHAT: INSTALL_DONE | WHEN: $(date +%s%N)"

      - name: Start NetBird
        run: |
          set -e
          echo "[LOG] WHAT: NETBIRD_START | WHICH: NB_SK_REDACTED | WHEN: $(date +%s%N)"

          sudo netbird up --setup-key "$NB_SK" --log-level error &

          sleep 15

          echo "[LOG] WHAT: NETBIRD_STATUS | WHEN: $(date +%s%N)"
          netbird status || true

      - name: Create RAM Working Area
        run: |
          set -e
          echo "[LOG] WHAT: RAMDISK_CREATE | WHICH: /ramdisk 11G tmpfs | WHEN: $(date +%s%N)"

          sudo mkdir -p /ramdisk
          sudo mount -t tmpfs -o size=11G tmpfs /ramdisk

          sudo mkdir -p /ramdisk/rclone-cache

          df -h /ramdisk

      - name: Create Native Drime Rclone Config (THE FIX)
        run: |
          set -e
          echo "[LOG] WHAT: DRIME_CONFIG_CREATE | WHICH: Native Drime Backend | VALUE: REDACTED | WHEN: $(date +%s%N)"

          cat > /tmp/rclone.conf <<EOF
[drime]
type = drime
access_token = ${DRIME}
EOF

          chmod 600 /tmp/rclone.conf

          echo "[LOG] WHAT: DRIME_CONFIG_READY | WHEN: $(date +%s%N)"

      - name: Mount Drime & Verify I/O
        run: |
          set -e
          echo "[LOG] WHAT: DRIME_MOUNT_START | WHICH: /mnt/drime | WHEN: $(date +%s%N)"

          sudo mkdir -p /mnt/drime

          if [ -f /etc/fuse.conf ]; then
            sudo sed -i 's/#user_allow_other/user_allow_other/' /etc/fuse.conf || true
          fi

          sudo rclone mount drime: /mnt/drime \
            --config /tmp/rclone.conf \
            --vfs-cache-mode full \
            --vfs-cache-max-size 7G \
            --vfs-cache-max-age 6h \
            --cache-dir /ramdisk/rclone-cache \
            --allow-other \
            --log-level INFO \
            --daemon

          sleep 10

          if mountpoint -q /mnt/drime; then
            echo "[LOG] WHAT: DRIME_MOUNT_SUCCESS | WHICH: /mnt/drime | WHEN: $(date +%s%N)"
          else
            echo "[LOG] WHAT: DRIME_MOUNT_FAILED | WHY: mountpoint_check_failed | WHEN: $(date +%s%N)"
            exit 1
          fi

          echo "[LOG] WHAT: DRIME_IO_TEST | WHEN: $(date +%s%N)"
          # Test writing a small file to verify I/O works before proceeding
          echo "AETHER_TEST" | sudo tee /mnt/drime/test.txt || { echo "[LOG] WHAT: DRIME_IO_FAILED | WHY: write_test_failed | WHEN: $(date +%s%N)"; exit 1; }
          sudo rm /mnt/drime/test.txt || true
          echo "[LOG] WHAT: DRIME_IO_SUCCESS | WHEN: $(date +%s%N)"

      - name: Download Ubuntu 26.04 LTS ISO Only
        run: |
          set -e
          echo "[LOG] WHAT: ISO_DOWNLOAD_START | WHICH: Ubuntu 26.04 LTS only | WHEN: $(date +%s%N)"

          # Strict 26.04 LTS only. Tries base 26.04, then 26.04.1 point release.
          wget -O /ramdisk/ubuntu-26.04.iso "https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso" || \
          wget -O /ramdisk/ubuntu-26.04.iso "https://releases.ubuntu.com/26.04.1/ubuntu-26.04.1-live-server-amd64.iso" || \
          wget -O /ramdisk/ubuntu-26.04.iso "https://releases.ubuntu.com/resolute/ubuntu-26.04.1-live-server-amd64.iso"

          echo "[LOG] WHAT: ISO_DOWNLOAD_DONE | WHICH: /ramdisk/ubuntu-26.04.iso | WHEN: $(date +%s%N)"

          ls -lh /ramdisk/ubuntu-26.04.iso
          df -h /ramdisk

      - name: Create Drime QCOW2 Disk
        run: |
          set -e
          echo "[LOG] WHAT: QCOW2_CREATE_START | WHICH: /mnt/drime/core.qcow2 10G | WHEN: $(date +%s%N)"

          if [ ! -f /mnt/drime/core.qcow2 ]; then
            sudo qemu-img create -f qcow2 /mnt/drime/core.qcow2 10G
            echo "[LOG] WHAT: QCOW2_CREATED | WHICH: new 10G virtual disk | WHEN: $(date +%s%N)"
          else
            echo "[LOG] WHAT: QCOW2_EXISTS | WHICH: reusing existing /mnt/drime/core.qcow2 | WHEN: $(date +%s%N)"
          fi

          sudo qemu-img info /mnt/drime/core.qcow2 || true
          ls -lh /mnt/drime/core.qcow2 || true

      - name: Boot VM With VNC 0.0.0.0:5900
        run: |
          set -e

          echo "[LOG] WHAT: VM_BOOT_PREP | WHEN: $(date +%s%N)"

          if [ -e /dev/kvm ]; then
            echo "[LOG] WHAT: KVM_DETECTED | WHICH: /dev/kvm | WHEN: $(date +%s%N)"
            ACCEL_ARGS="-accel kvm -cpu host"
          else
            echo "[LOG] WHAT: KVM_NOT_FOUND | WHY: fallback_to_tcg | WHEN: $(date +%s%N)"
            ACCEL_ARGS="-accel tcg -cpu max"
          fi

          echo "[LOG] WHAT: VM_BOOT_START | WHICH: VNC 0.0.0.0:5900 | DISK: Drime QCOW2 | ISO: Ubuntu 26.04 | WHEN: $(date +%s%N)"

          (
            while true; do
              sleep 300
              echo "[LOG] WHAT: HEARTBEAT | STATUS: VM_RUNNING | VNC: 0.0.0.0:5900 | WHEN: $(date +%s%N)"
              echo "[LOG] WHAT: RESOURCE_STATUS | WHEN: $(date +%s%N)"
              free -h || true
              df -h /ramdisk || true
              ls -lh /mnt/drime/core.qcow2 || true
            done
          ) &
          HB_PID=$!

          sudo qemu-system-x86_64 \
            -m 3072 \
            -smp 4 \
            $ACCEL_ARGS \
            -boot d \
            -cdrom /ramdisk/ubuntu-26.04.iso \
            -drive file=/mnt/drime/core.qcow2,if=virtio,format=qcow2,cache=writeback,aio=threads \
            -vnc 0.0.0.0:0 \
            -display none

          QEMU_EXIT=$?

          echo "[LOG] WHAT: VM_EXITED | CODE: $QEMU_EXIT | WHEN: $(date +%s%N)"

          kill $HB_PID || true

          echo "[LOG] WHAT: DRIME_FLUSH_START | WHY: VM disk closed, pushing dirty cache | WHEN: $(date +%s%N)"
          sync

          sudo umount /mnt/drime || sudo fusermount3 -u /mnt/drime || true

          echo "[LOG] WHAT: DRIME_FLUSH_DONE | WHEN: $(date +%s%N)"

          exit $QEMU_EXIT
