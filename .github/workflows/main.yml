name: AetherGrid AIO (ShardFS v22)

on:
  workflow_dispatch:
    inputs:
      force_reinstall:
        description: 'Wipe shards and reinstall OS (true/false)'
        required: false
        default: 'false'

jobs:
  boot-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      NB_SK:  ${{ secrets.NB_SK }}
      DRIME:  ${{ secrets.DRIME }}
      DRIME1: ${{ secrets.DRIME1 }}
      DRIME2: ${{ secrets.DRIME2 }}
      DRIME3: ${{ secrets.DRIME3 }}

    steps:
      - name: Install Minimal Stack (+ fusepy)
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get remove -y rclone || true
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils qemu-system-common fuse3 fuse wget curl ca-certificates python3 python3-pip
          curl https://rclone.org/install.sh | sudo bash
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          pip3 install --break-system-packages fusepy || sudo pip3 install fusepy
          python3 -c "import fuse; print('fusepy OK')"
          echo "[LOG] WHAT: INSTALL_DONE | WHEN: $(date +%s%N)"

      - name: NetBird Mesh Up
        run: |
          set -e
          sudo netbird up --setup-key "$NB_SK" --log-level error &
          sleep 15
          echo "[LOG] WHAT: NETBIRD_UP | WHEN: $(date +%s%N)"

      - name: Build Drime Config
        run: |
          set -e
          CONF=/tmp/rclone.conf; : > $CONF
          printf '[drime0]\ntype = drime\naccess_token = %s\n' "$DRIME" >> $CONF
          N=1; i=1
          for V in DRIME1 DRIME2 DRIME3; do
            VAL="${!V}"
            if [ -n "$VAL" ]; then
              printf '[drime%d]\ntype = drime\naccess_token = %s\n' "$i" "$VAL" >> $CONF
              N=$((N+1)); i=$((i+1))
            fi
          done
          if [ "$N" -gt 1 ]; then
            UP=""
            for k in $(seq 0 $((N-1))); do UP="$UP drime$k:"; done
            printf '[union]\ntype = union\nupstreams =%s\ncreate_policy = epmfs\naction_policy = epall\nsearch_policy = ff\n' "$UP" >> $CONF
            REMOTE=union
          else
            REMOTE=drime0
          fi
          chmod 600 $CONF
          echo "REMOTE=$REMOTE" >> $GITHUB_ENV
          echo "ACCOUNTS=$N"    >> $GITHUB_ENV
          echo "[LOG] WHAT: CONFIG_BUILT | ACCOUNTS: $N | WHEN: $(date +%s%N)"

      - name: Create Real Parent Folders
        run: |
          set -e
          rclone mkdir --config /tmp/rclone.conf "${REMOTE}:vm"  || true
          rclone mkdir --config /tmp/rclone.conf "${REMOTE}:iso" || true
          echo "[LOG] WHAT: PARENT_FOLDERS_READY | WHEN: $(date +%s%N)"

      - name: Self-Heal + Mode + Virtual Size
        run: |
          set -e
          if [ "${{ github.event.inputs.force_reinstall }}" = "true" ]; then
            rclone purge --config /tmp/rclone.conf "${REMOTE}:vm" || true
            rclone mkdir --config /tmp/rclone.conf "${REMOTE}:vm" || true
            echo "[LOG] WHAT: SELF_HEAL | purged+recreated vm/ | WHEN: $(date +%s%N)"
          fi
          EXIST=$(rclone lsf --config /tmp/rclone.conf "${REMOTE}:vm" 2>/dev/null | head -1 || true)
          if [ -n "$EXIST" ]; then
            MODE=BOOT
            if [ "$ACCOUNTS" -eq 1 ]; then VSIZE=18; else VSIZE=$((18*ACCOUNTS-4)); fi
          else
            MODE=FIRST
            if [ "$ACCOUNTS" -eq 1 ]; then VSIZE=16; else VSIZE=$((18*ACCOUNTS-4)); fi
          fi
          echo "MODE=$MODE"   >> $GITHUB_ENV
          echo "VSIZE=$VSIZE" >> $GITHUB_ENV
          echo "[LOG] WHAT: MODE_DETECT | MODE: $MODE | VSIZE: ${VSIZE}G | WHEN: $(date +%s%N)"

      - name: Stream ISO To Drime iso/ + HTTPS Fallback
        if: env.MODE == 'FIRST'
        run: |
          HAS=$(rclone lsf --config /tmp/rclone.conf "${REMOTE}:iso" 2>/dev/null | grep -c '^ubuntu.iso$' || true)
          if [ "${HAS:-0}" != "0" ]; then
            echo "ISO_SRC=drime" >> $GITHUB_ENV
            echo "[LOG] WHAT: ISO_REUSE | WHEN: $(date +%s%N)"
          else
            echo "[LOG] WHAT: ISO_STREAM_TO_DRIME | WHEN: $(date +%s%N)"
            if wget -qO- "https://releases.ubuntu.com/resolute/ubuntu-26.04-live-server-amd64.iso" \
               | rclone --config /tmp/rclone.conf rcat "${REMOTE}:iso/ubuntu.iso"; then
              echo "ISO_SRC=drime" >> $GITHUB_ENV
            else
              echo "ISO_SRC=https" >> $GITHUB_ENV
              echo "[LOG] WHAT: ISO_FALLBACK | SRC: https direct | WHEN: $(date +%s%N)"
            fi
          fi

      - name: Mount Drime Read Path (cache-off)
        run: |
          set -e
          sudo mkdir -p /mnt/drime
          sudo sed -i 's/#user_allow_other/user_allow_other/' /etc/fuse.conf || true
          sudo rclone mount "${REMOTE}:" /mnt/drime \
            --config /tmp/rclone.conf --vfs-cache-mode off \
            --allow-other --log-level INFO --daemon
          sleep 8
          mountpoint -q /mnt/drime
          echo "[LOG] WHAT: DRIME_MOUNT_OK | WHEN: $(date +%s%N)"

      - name: Write ShardFS Daemon (FUSE single-file block device)
        run: |
          cat > /tmp/shardfs.py <<'PYEOF'
          import os,stat,errno,subprocess,threading,time,signal,traceback
          from concurrent.futures import ThreadPoolExecutor
          from fuse import FUSE, FuseOSError, Operations
          CONF="/tmp/rclone.conf"; REMOTE=os.environ["REMOTE"]; VSIZE=int(os.environ["VSIZE"])*1024**3
          SHARD=4*1024*1024; DIRTY_MAX=256*1024*1024; MNT="/mnt/sharddisk"
          RC=["rclone","--config",CONF]
          lock=threading.Lock(); cond=threading.Condition(lock)
          dirty={}; touched={}; uploading={}; fetching=set()
          def name(i): return f"vm/shard_{i:06d}"
          def put(i,data):
              p=subprocess.run(RC+["rcat",f"{REMOTE}:{name(i)}"],input=bytes(data),capture_output=True)
              return p.returncode==0
          def get(i):
              p=subprocess.run(RC+["cat",f"{REMOTE}:{name(i)}"],capture_output=True)
              if p.returncode==0 and p.stdout: return bytearray(p.stdout)
              return bytearray(SHARD)
          def uploader():
              pool=ThreadPoolExecutor(4); futs={}
              while True:
                  with lock:
                      now=time.time()
                      for i in [i for i in dirty if now-touched[i]>2.0 and i not in futs]:
                          uploading[i]=dirty.pop(i); futs[i]=pool.submit(put,i,uploading[i])
                      for i in [i for i,f in futs.items() if f.done()]:
                          f=futs.pop(i); ok=f.result()
                          if ok: uploading.pop(i,None)
                          else: dirty[i]=uploading.pop(i); touched[i]=time.time()
                      cond.notify_all()
                  time.sleep(0.5)
          def drain():
              while True:
                  with lock:
                      if not dirty and not uploading: return
                  time.sleep(0.3)
          def shard_buf(i):
              with lock:
                  if i in dirty: return dirty[i]
                  if i in uploading: return uploading[i]
                  while i in fetching: cond.wait(0.2)
                  fetching.add(i)
              b=get(i)
              with lock:
                  fetching.discard(i)
                  if i not in dirty: dirty[i]=b; touched[i]=time.time()
                  return dirty[i]
          def read_at(off,length):
              out=bytearray(); pos=0
              while pos<length:
                  i=off//SHARD; s=off-i*SHARD; n=min(SHARD-s,length-pos)
                  out+=shard_buf(i)[s:s+n]; off+=n; pos+=n
              return bytes(out)
          def write_at(off,data):
              pos=0
              while pos<len(data):
                  i=off//SHARD; s=off-i*SHARD; n=min(SHARD-s,len(data)-pos)
                  b=shard_buf(i)
                  with lock:
                      b[s:s+n]=data[pos:pos+n]; touched[i]=time.time()
                      while len(dirty)*SHARD>DIRTY_MAX: cond.wait(0.2)
                  off+=n; pos+=n
          class ShardFS(Operations):
              def getattr(self,path,fh=None):
                  if path=="/": return dict(st_mode=(stat.S_IFDIR|0o755),st_nlink=2)
                  if path=="/disk.img": return dict(st_mode=(stat.S_IFREG|0o600),st_nlink=1,st_size=VSIZE,st_blksize=4096,st_blocks=VSIZE//512)
                  raise FuseOSError(errno.ENOENT)
              def readdir(self,path,fh):
                  for p in (".","..","disk.img"): yield p
              def open(self,path,flags):
                  if path!="/disk.img": raise FuseOSError(errno.ENOENT)
                  return 0
              def read(self,path,size,offset,fh):
                  if offset>=VSIZE: return b""
                  size=min(size,VSIZE-offset)
                  return read_at(offset,size)
              def write(self,path,data,offset,fh):
                  write_at(offset,bytes(data))
                  return len(data)
              def flush(self,path,fh): return 0
              def fsync(self,path,datasync,fh): drain(); return 0
              def release(self,path,fh): drain(); return 0
              def statfs(self,path):
                  return dict(f_bsize=4096,f_frsize=4096,f_blocks=VSIZE//4096,f_bfree=0,f_bavail=0,f_files=1,f_ffree=0)
              def truncate(self,path,length,fh=None): return 0
          def on_term(sig,frm):
              threading.Thread(target=lambda:(drain(),os._exit(0))).start()
          signal.signal(signal.SIGTERM,on_term); signal.signal(signal.SIGINT,on_term)
          threading.Thread(target=uploader,daemon=True).start()
          os.makedirs(MNT,exist_ok=True)
          print(f"[LOG] WHAT: SHARDFS_READY | MNT: {MNT} | VSIZE: {VSIZE} | WHEN: {time.time_ns()}",flush=True)
          FUSE(ShardFS(),MNT,foreground=True,direct_io=True,allow_other=True,nothreads=False)
          PYEOF
          python3 -m py_compile /tmp/shardfs.py
          echo "[LOG] WHAT: SHARDFS_COMPILED | WHEN: $(date +%s%N)"

      - name: Launch ShardFS + Assert File
        run: |
          set -e
          sudo env REMOTE=$REMOTE VSIZE=$VSIZE nohup python3 /tmp/shardfs.py > /tmp/shardfs.log 2>&1 &
          sleep 8
          cat /tmp/shardfs.log
          grep -q SHARDFS_READY /tmp/shardfs.log
          mountpoint -q /mnt/sharddisk || { echo "[LOG] WHAT: SHARDFS_MOUNT_DEAD | WHEN: $(date +%s%N)"; exit 1; }
          ls -l /mnt/sharddisk/disk.img
          echo "[LOG] WHAT: SHARDFS_ALIVE | WHEN: $(date +%s%N)"

      - name: Probe Disk (Plain File, No Wire)
        run: |
          set -e
          qemu-img info /mnt/sharddisk/disk.img
          echo "[LOG] WHAT: DISK_PROBE_VERIFIED | WHEN: $(date +%s%N)"

      - name: Boot VM (Disk = ShardFS file, VNC 5900)
        run: |
          if [ -e /dev/kvm ]; then ACC="-accel kvm -cpu host"; else ACC="-accel tcg -cpu max"; fi
          ARGS="-m 12288 -smp 4 $ACC -vnc 0.0.0.0:0 -display none"
          ARGS="$ARGS -drive file=/mnt/sharddisk/disk.img,if=virtio,format=raw,cache=none"
          if [ "$MODE" = "FIRST" ]; then
            if [ "$ISO_SRC" = "drime" ]; then ARGS="$ARGS -boot order=dc -cdrom /mnt/drime/iso/ubuntu.iso"
            else ARGS="$ARGS -boot order=dc -cdrom https://releases.ubuntu.com/resolute/ubuntu-26.04-live-server-amd64.iso"; fi
          else
            ARGS="$ARGS -boot order=c"
          fi
          echo "[LOG] WHAT: VM_START | MODE: $MODE | ISO_SRC: $ISO_SRC | VNC: 0.0.0.0:5900 | WHEN: $(date +%s%N)"
          ( while true; do sleep 300; \
            echo "[LOG] WHAT: HEARTBEAT | MODE: $MODE | WHEN: $(date +%s%N)"; \
            free -h | head -2 || true; \
            echo "[LOG] WHAT: SHARD_COUNT | N: $(rclone lsf --config /tmp/rclone.conf "${REMOTE}:vm" 2>/dev/null | wc -l) | WHEN: $(date +%s%N)"; \
          done ) &
          HB=$!
          sudo qemu-system-x86_64 $ARGS &
          QP=$!
          EXIT=0; wait $QP || EXIT=$?
          kill $HB 2>/dev/null || true
          echo "VMEXIT=$EXIT" >> $GITHUB_ENV
          echo "[LOG] WHAT: VM_EXIT | CODE: $EXIT | WHEN: $(date +%s%N)"
          exit $EXIT

      - name: Drain + Guarded Cleanup (ALWAYS)
        if: always()
        run: |
          echo "[LOG] WHAT: DRAIN_START | WHEN: $(date +%s%N)"
          sudo pkill -TERM -f qemu-system-x86_64 || true
          sleep 3
          sudo pkill -TERM -f shardfs.py || true
          sleep 15
          tail -20 /tmp/shardfs.log || true
          echo "[LOG] WHAT: FINAL_SHARDS | N: $(rclone lsf --config /tmp/rclone.conf "${REMOTE}:vm" 2>/dev/null | wc -l) | WHEN: $(date +%s%N)"
          if [ "$MODE" = "FIRST" ] && [ "$VMEXIT" = "0" ] && [ "$ACCOUNTS" -eq 1 ]; then
            rclone deletefile --config /tmp/rclone.conf "${REMOTE}:iso/ubuntu.iso" || true
            echo "[LOG] WHAT: ISO_CLEANUP | quota freed for 18G | WHEN: $(date +%s%N)"
          fi
          sudo umount /mnt/drime || sudo fusermount3 -u /mnt/drime || true
          sudo umount /mnt/sharddisk || sudo fusermount3 -u /mnt/sharddisk || true
          echo "[LOG] WHAT: DRAIN_DONE | WHEN: $(date +%s%N)"
