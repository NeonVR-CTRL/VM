name: VM

on:
  workflow_dispatch:

jobs:
  boot-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 Hours Hard Limit

    env:
      NB_SK:  ${{ secrets.NB_SK }}
      DRIME:  ${{ secrets.DRIME }}
      DRIME1: ${{ secrets.DRIME1 }}
      DRIME2: ${{ secrets.DRIME2 }}
      DRIME3: ${{ secrets.DRIME3 }}

    steps:
      - name: Install Minimal Stack (Headless QEMU + Latest Rclone + NetBird)
        run: |
          set -e
          echo "[LOG] WHAT: INSTALL_START | WHEN: $(date +%s%N)"
          sudo apt-get update -y
          sudo apt-get remove -y rclone || true
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils qemu-system-common fuse3 wget curl ca-certificates
          curl https://rclone.org/install.sh | sudo bash
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          rclone version
          echo "[LOG] WHAT: INSTALL_DONE | WHEN: $(date +%s%N)"

      - name: NetBird Mesh Up
        run: |
          set -e
          sudo netbird up --setup-key "$NB_SK" --log-level error &
          sleep 15
          echo "[LOG] WHAT: NETBIRD_UP | WHEN: $(date +%s%N)"

      - name: RAM Disk + FUSE Prep
        run: |
          set -e
          sudo mkdir -p /ramdisk /mnt/drime
          sudo mount -t tmpfs -o size=6G tmpfs /ramdisk
          sudo mkdir -p /ramdisk/cache
          sudo sed -i 's/#user_allow_other/user_allow_other/' /etc/fuse.conf || true
          echo "[LOG] WHAT: RAMDISK_READY | CAP: 6G (unused = 0 RAM) | WHEN: $(date +%s%N)"

      - name: Build Drime Config (Auto-Detect Accounts + Single Disk)
        run: |
          set -e
          CONF=/tmp/rclone.conf
          : > $CONF
          printf '[drime0]\ntype = drime\naccess_token = %s\n' "$DRIME" >> $CONF
          N=1; i=1
          for V in DRIME1 DRIME2 DRIME3; do
            VAL="${!V}"
            if [ -n "$VAL" ]; then
              printf '[drime%d]\ntype = drime\naccess_token = %s\n' "$i" "$VAL" >> $CONF
              N=$((N+1)); i=$((i+1))
            fi
          done
          if [ "$N" -gt 1 ]; then
            UP=""
            for k in $(seq 0 $((N-1))); do UP="$UP drime$k:"; done
            printf '[union]\ntype = union\nupstreams =%s\ncreate_policy = epmfs\naction_policy = epall\nsearch_policy = ff\n' "$UP" >> $CONF
            printf '[disk]\ntype = chunker\nupstream = union:\nchunk_size = 10G\nname_format = *.part###\n' >> $CONF
            REMOTE=disk
          else
            REMOTE=drime0
          fi
          SIZE=$((18*N))
          chmod 600 $CONF
          echo "REMOTE=$REMOTE"  >> $GITHUB_ENV
          echo "DISK_SIZE=$SIZE" >> $GITHUB_ENV
          echo "ACCOUNTS=$N"     >> $GITHUB_ENV
          echo "[LOG] WHAT: CONFIG_BUILT | ACCOUNTS: $N | REMOTE: $REMOTE | SINGLE_DISK_CAP: ${SIZE}G | WHEN: $(date +%s%N)"

      - name: Mount Drime (Verified Active)
        run: |
          set -e
          sudo rclone mount "${REMOTE}:" /mnt/drime \
            --config /tmp/rclone.conf \
            --vfs-cache-mode full \
            --vfs-cache-max-size 2G \
            --cache-dir /ramdisk/cache \
            --allow-other \
            --log-level INFO \
            --daemon
          sleep 10
          mountpoint -q /mnt/drime && ls /mnt/drime >/dev/null 2>&1
          echo "[LOG] WHAT: DRIME_MOUNT_OK | REMOTE: $REMOTE | WHEN: $(date +%s%N)"

      - name: Detect Boot Mode + Prepare Single Disk
        run: |
          set -e
          if [ -f /mnt/drime/core.qcow2 ]; then
            MODE=BOOT
            echo "[LOG] WHAT: MODE_DETECT | MODE: REBOOT | ISO: SKIPPED | WHEN: $(date +%s%N)"
            sudo qemu-img info /mnt/drime/core.qcow2 || true
            sudo qemu-img resize /mnt/drime/core.qcow2 "${DISK_SIZE}G" 2>/dev/null || \
              echo "[LOG] WHAT: RESIZE_SKIP | WHY: same_or_smaller_size | WHEN: $(date +%s%N)"
          else
            MODE=FIRST
            echo "[LOG] WHAT: MODE_DETECT | MODE: FIRST_BOOT | ISO: REQUIRED | WHEN: $(date +%s%N)"
            sudo qemu-img create -f qcow2 /mnt/drime/core.qcow2 "${DISK_SIZE}G"
          fi
          echo "MODE=$MODE" >> $GITHUB_ENV

      - name: Download Ubuntu 26.04 ISO (FIRST BOOT ONLY)
        run: |
          set -e
          if [ "$MODE" = "FIRST" ]; then
            echo "[LOG] WHAT: ISO_DOWNLOAD_START | WHICH: Ubuntu 26.04 LTS only | WHEN: $(date +%s%N)"
            wget -O /ramdisk/ubuntu.iso "https://releases.ubuntu.com/resolute/ubuntu-26.04-live-server-amd64.iso" || \
            wget -O /ramdisk/ubuntu.iso "https://releases.ubuntu.com/resolute/ubuntu-26.04.1-live-server-amd64.iso"
            echo "[LOG] WHAT: ISO_READY | WHEN: $(date +%s%N)"
          else
            echo "[LOG] WHAT: ISO_DOWNLOAD_SKIPPED | WHY: OS already installed on Drime | WHEN: $(date +%s%N)"
          fi

      - name: Boot VM (16GB RAM / 2c4t / VNC 0.0.0.0:5900)
        run: |
          set -e
          if [ -e /dev/kvm ]; then ACC="-accel kvm -cpu host"; else ACC="-accel tcg -cpu max"; fi
          ARGS="-m 16384 -smp 4,sockets=1,cores=2,threads=2 $ACC -vnc 0.0.0.0:0 -display none"
          ARGS="$ARGS -drive file=/mnt/drime/core.qcow2,if=virtio,format=qcow2,cache=writeback,aio=threads"
          if [ "$MODE" = "FIRST" ]; then
            ARGS="$ARGS -boot order=dc -cdrom /ramdisk/ubuntu.iso"
          else
            ARGS="$ARGS -boot order=c"
          fi
          echo "[LOG] WHAT: VM_START | MODE: $MODE | RAM: 16G | CPU: 2c4t | VNC: 0.0.0.0:5900 | WHEN: $(date +%s%N)"

          ( while true; do sleep 300; \
            echo "[LOG] WHAT: HEARTBEAT | MODE: $MODE | WHEN: $(date +%s%N)"; \
            free -h | head -2 || true; df -h /ramdisk | tail -1 || true; \
            ls /mnt/drime >/dev/null 2>&1 || echo "[LOG] WHAT: DRIME_LINK_LOST | WHEN: $(date +%s%N)"; \
          done ) &
          HB=$!

          sudo qemu-system-x86_64 $ARGS &
          QP=$!
          EXIT=0
          wait $QP || EXIT=$?
          kill $HB 2>/dev/null || true
          echo "[LOG] WHAT: VM_EXIT | CODE: $EXIT | WHEN: $(date +%s%N)"
          exit $EXIT

      - name: Flush Drime Cache (ALWAYS - Protects Your Data)
        if: always()
        run: |
          echo "[LOG] WHAT: FLUSH_START | WHY: VM closed, pushing dirty cache to Drime | WHEN: $(date +%s%N)"
          sync || true
          sleep 5
          sudo umount /mnt/drime || sudo fusermount3 -u /mnt/drime || true
          echo "[LOG] WHAT: FLUSH_DONE | DRIME_SAFE | WHEN: $(date +%s%N)"
