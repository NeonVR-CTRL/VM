name: AetherGrid AIO (AetherCore v36 Native)

on:
  workflow_dispatch:
    inputs:
      force_reinstall:
        description: 'Wipe LOB and reinstall OS (true/false)'
        required: false
        default: 'false'

jobs:
  boot-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      NB_SK:  ${{ secrets.NB_SK }}
      DRIME:  ${{ secrets.DRIME }}
      DRIME1: ${{ secrets.DRIME1 }}
      DRIME2: ${{ secrets.DRIME2 }}
      DRIME3: ${{ secrets.DRIME3 }}

    steps:
      - name: Install Minimal Stack
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get remove -y rclone || true
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils qemu-system-common qemu-block-extra fuse3 libfuse2 wget curl ca-certificates python3 python3-pip
          curl https://rclone.org/install.sh | sudo bash
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          sudo pip3 install --break-system-packages fusepy requests
          sudo python3 -c "import fuse,requests; print('deps OK')"
          echo "[LOG] WHAT: INSTALL_DONE | WHEN: $(date +%s%N)"

      - name: NetBird Mesh Up
        run: |
          set -e
          sudo netbird up --setup-key "$NB_SK" --log-level error &
          sleep 15
          echo "[LOG] WHAT: NETBIRD_UP | WHEN: $(date +%s%N)"

      - name: Build rclone Config (control plane only)
        run: |
          set -e
          CONF=/tmp/rclone.conf; : > $CONF
          printf '[drime0]\ntype = drime\naccess_token = %s\n' "$DRIME" >> $CONF
          N=1; i=1
          for V in DRIME1 DRIME2 DRIME3; do
            VAL="${!V}"
            if [ -n "$VAL" ]; then
              printf '[drime%d]\ntype = drime\naccess_token = %s\n' "$i" "$VAL" >> $CONF
              N=$((N+1)); i=$((i+1))
            fi
          done
          if [ "$N" -gt 1 ]; then
            UP=""
            for k in $(seq 0 $((N-1))); do UP="$UP drime$k:"; done
            printf '[union]\ntype = union\nupstreams =%s\ncreate_policy = epmfs\naction_policy = epall\nsearch_policy = ff\n' "$UP" >> $CONF
            REMOTE=union
          else
            REMOTE=drime0
          fi
          chmod 600 $CONF
          echo "REMOTE=$REMOTE" >> $GITHUB_ENV
          echo "ACCOUNTS=$N"    >> $GITHUB_ENV
          echo "[LOG] WHAT: CONFIG_BUILT | ACCOUNTS: $N | WHEN: $(date +%s%N)"

      - name: Self-Heal + Mode + Size
        run: |
          set -e
          rclone mkdir --config /tmp/rclone.conf "${REMOTE}:lob" || true
          rclone mkdir --config /tmp/rclone.conf "${REMOTE}:lob/idx" || true
          rclone mkdir --config /tmp/rclone.conf "${REMOTE}:lob/seg" || true
          if [ "${{ github.event.inputs.force_reinstall }}" = "true" ]; then
            rclone purge --config /tmp/rclone.conf "${REMOTE}:lob" || true
            rclone mkdir --config /tmp/rclone.conf "${REMOTE}:lob/idx" || true
            rclone mkdir --config /tmp/rclone.conf "${REMOTE}:lob/seg" || true
            echo "[LOG] WHAT: SELF_HEAL | purged lob/ | WHEN: $(date +%s%N)"
          fi
          IDX=$(rclone lsf --config /tmp/rclone.conf "${REMOTE}:lob/idx/" 2>/dev/null | head -1 || true)
          if [ -n "$IDX" ]; then MODE=BOOT; else MODE=FIRST; fi
          if [ "$ACCOUNTS" -eq 1 ]; then VSIZE=18; else VSIZE=$((18*ACCOUNTS-4)); fi
          echo "MODE=$MODE"   >> $GITHUB_ENV
          echo "VSIZE=$VSIZE" >> $GITHUB_ENV
          echo "[LOG] WHAT: MODE_DETECT | MODE: $MODE | VSIZE: ${VSIZE}G | WHEN: $(date +%s%N)"

      - name: Resolve Media (mirror)
        if: env.MODE == 'FIRST'
        run: |
          set -e
          ISO_URL=""
          for u in "https://releases.ubuntu.com/resolute/ubuntu-26.04.1-live-server-amd64.iso" \
                   "https://releases.ubuntu.com/resolute/ubuntu-26.04-live-server-amd64.iso"; do
            if curl -sfI "$u" | head -1 | grep -qE "HTTP/[^ ]+ (200|302)"; then ISO_URL=$u; break; fi
          done
          [ -n "$ISO_URL" ] || { echo "[LOG] WHAT: MEDIA_DEAD | WHEN: $(date +%s%N)"; exit 1; }
          echo "CDROM=$ISO_URL" >> $GITHUB_ENV
          rclone deletefile --config /tmp/rclone.conf "${REMOTE}:iso/ubuntu.iso" || true
          echo "[LOG] WHAT: MEDIA_RESOLVED | SRC: mirror | WHEN: $(date +%s%N)"

      - name: Write AetherCore v36 (Native Drime client)
        run: |
          cat > /tmp/aethercore.py <<'PYEOF'
          import os,stat,errno,zlib,json,threading,time,signal,traceback
          from collections import OrderedDict
          from concurrent.futures import ThreadPoolExecutor
          import requests
          from fuse import FUSE, FuseOSError, Operations
          TOKEN=os.environ["DRIME_TOKEN"]; VSIZE=int(os.environ["VSIZE"])*1024**3
          MNT="/mnt/aether"; API="https://app.drime.cloud/api/v1"; BASE="https://app.drime.cloud/"
          SLOT=256*1024; PART=5*1024*1024; SEGLRU_MAX=64; COMMIT_WINDOW=2.0
          S=requests.Session(); S.headers.update({"Authorization":"Bearer "+TOKEN,"Accept":"application/json"})
          pool=ThreadPoolExecutor(8)
          lock=threading.Lock(); commit_req=threading.Event(); commit_done=threading.Event()
          index={}; buf={}; segseq=[0]; idxseq=[0]; seglru=OrderedDict(); segurl={}
          RAWLOGGED=set()
          def log(w,v): print(f"[LOG] WHAT: {w} | {v} | WHEN: {time.time_ns()}",flush=True)
          def raw(tag,j):
              if tag not in RAWLOGGED:
                  RAWLOGGED.add(tag); log("RAW_"+tag, json.dumps(j)[:900])
          def walk(o):
              st=[o]
              while st:
                  c=st.pop()
                  if isinstance(c,dict):
                      yield c; st.extend(c.values())
                  elif isinstance(c,list): st.extend(c)
          def find_items(o):
              st=[o]
              while st:
                  c=st.pop()
                  if isinstance(c,list) and c and all(isinstance(x,dict) and "id" in x and "name" in x for x in c): return c
                  if isinstance(c,dict): st.extend(c.values())
                  elif isinstance(c,list): st.extend(c)
              return []
          def dig(o,*keys):
              for d in walk(o):
                  for kk,vv in d.items():
                      if kk.lower() in keys: return vv
              return None
          def digurl(o):
              for d in walk(o):
                  for kk,vv in d.items():
                      if isinstance(vv,str) and ("url" in kk.lower() or kk.lower()=="link") and (vv.startswith("/") or vv.startswith("http")): return vv
              return None
          def list_dir(fid):
              out=[]; page=1
              while True:
                  r=S.get(API+"/drive/file-entries",params={"folderId":fid,"perPage":200,"page":page},timeout=60)
                  r.raise_for_status(); j=r.json(); raw("LIST",j)
                  items=find_items(j); out+=items
                  if len(items)<200: break
                  page+=1
              return out
          FOLDERS={}
          def folder(path):
              if path in FOLDERS: return FOLDERS[path]
              cur=""
              for leaf in path.split("/"):
                  key=path if leaf==path.split("/")[-1] else "/".join(path.split("/")[:path.split("/").index(leaf)+1])
                  items=[i for i in list_dir(cur) if i.get("name")==leaf]
                  if items: cur=str(items[0]["id"])
                  else:
                      r=S.post(API+"/folders",json={"Name":leaf,"ParentID":cur},timeout=60)
                      r.raise_for_status(); cur=str(dig(r.json(),"id"))
                  FOLDERS[key]=cur
              FOLDERS[path]=cur; return cur
          def mp_create(fname,parent):
              r=S.post(API+"/s3/multipart/create",json={"Filename":fname,"Mime":"application/octet-stream","Size":0,"Extension":"bin","ParentID":parent,"RelativePath":fname},timeout=60)
              r.raise_for_status(); j=r.json(); raw("MPCREATE",j)
              return str(dig(j,"uploadid","upload_id")), str(dig(j,"key"))
          def mp_sign(up,key,nums):
              r=S.post(API+"/s3/multipart/batch-sign-part-urls",json={"UploadID":up,"Key":key,"PartNumbers":nums},timeout=60)
              r.raise_for_status(); j=r.json(); raw("MPSIGN",j)
              m={}
              for d in walk(j):
                  pn=None; url=None
                  for k,v in d.items():
                      if isinstance(v,int) and "part" in k.lower(): pn=v
                      if isinstance(v,str) and v.startswith("http"): url=v
                  if pn is not None and url: m[pn]=url
              return m
          def mp_put(url,data):
              r=requests.put(url,data=data,headers={"Content-Type":"application/octet-stream"},timeout=120)
              r.raise_for_status(); return r.headers.get("ETag","")
          def mp_complete(up,key,parts):
              r=S.post(API+"/s3/multipart/complete",json={"UploadID":up,"Key":key,"Parts":parts},timeout=120)
              r.raise_for_status(); j=r.json(); raw("MPCOMPLETE",j)
              return j
          def upload_blob(name,data,parent):
              up,key=mp_create(name,parent)
              nparts=max(1,(len(data)+PART-1)//PART)
              urls=mp_sign(up,key,list(range(1,nparts+1)))
              parts=[]
              def do(pn):
                  chunk=data[(pn-1)*PART:pn*PART]
                  et=mp_put(urls[pn],chunk)
                  return {"PartNumber":pn,"ETag":et}
              futs=[pool.submit(do,pn) for pn in range(1,nparts+1)]
              for f in futs: parts.append(f.result())
              parts.sort(key=lambda p:p["PartNumber"])
              j=mp_complete(up,key,parts)
              u=digurl(j)
              return u
          def load_head():
              fid=folder("lob/idx")
              names=sorted(i["name"] for i in list_dir(fid))
              if not names: return
              idxseq[0]=int(names[-1].split(".")[0]) if names[-1].split(".")[0].isdigit() else 0
              it=[i for i in list_dir(fid) if i["name"]==names[-1]][0]
              u=it.get("url") or digurl(it)
              r=S.get(BASE+u if u.startswith("/") else u,timeout=120); r.raise_for_status()
              d=json.loads(zlib.decompress(r.content))
              index.update(d["index"]); segseq[0]=d.get("segseq",0)
              for k,v in d.get("segurls",{}).items(): segurl[k]=v
              log("HEAD_LOADED", f"IDX:{idxseq[0]} SEG:{segseq[0]} SLOTS:{len(index)}")
          def checkpoint():
              with lock:
                  idxseq[0]+=1; s=idxseq[0]
                  snap={"index":dict(index),"segseq":segseq[0],"segurls":dict(segurl)}
              rawb=zlib.compress(json.dumps(snap).encode(),6)
              upload_blob(f"{s:010d}.idx",rawb,folder("lob/idx"))
          def commit():
              with lock:
                  slots=list(buf.keys())
                  if not slots: return False
                  table={}; chunks=[]; off=0
                  for s in slots:
                      c=zlib.compress(bytes(buf[s]),1); table[s]=[off,len(c)]; chunks.append(c); off+=len(c)
                  buf.clear()
                  segseq[0]+=1; seq=segseq[0]; name=f"seg{seq:010d}.bin"
                  for s in slots: index[str(s)]=f"{seq}:{table[s][0]}:{table[s][1]}"
              payload=b"".join(chunks)
              u=upload_blob(name,payload,folder("lob/seg"))
              with lock: segurl[str(seq)]=u or ""
              checkpoint()
              return True
          def committer():
              while True:
                  commit_req.wait(COMMIT_WINDOW)
                  commit_req.clear()
                  try:
                      commit(); commit_done.set()
                  except Exception:
                      traceback.print_exc(); commit_done.set()
          def drain():
              with lock: need=len(buf)>0
              if not need: return
              commit_done.clear(); commit_req.set(); commit_done.wait(120)
          def seg_bytes(seq):
              with lock:
                  if seq in seglru: seglru.move_to_end(seq); return seglru[seq]
                  u=segurl.get(str(seq),"")
              if not u:
                  it=[i for i in list_dir(folder("lob/seg")) if i["name"]==f"seg{seq:010d}.bin"]
                  u=it[0].get("url") or digurl(it[0]) if it else ""
                  with lock: segurl[str(seq)]=u
              r=S.get(BASE+u if u.startswith("/") else u,timeout=120); r.raise_for_status()
              d=r.content
              with lock:
                  seglru[seq]=d; seglru.move_to_end(seq)
                  while len(seglru)>SEGLRU_MAX: seglru.popitem(last=False)
              return d
          def read_slot(slot):
              with lock:
                  if slot in buf: return bytes(buf[slot])
                  ptr=index.get(str(slot))
                  if ptr is None: return b"\x00"*SLOT
              seq,off,ln=map(int,ptr.split(":"))
              pay=seg_bytes(seq)
              return zlib.decompress(pay[off:off+ln])
          def write_at(off,data):
              pos=0
              while pos<len(data):
                  slot=off//SLOT; s=off-slot*SLOT; n=min(SLOT-s,len(data)-pos)
                  with lock:
                      b=buf.get(slot)
                      if b is None:
                          b=bytearray(read_slot(slot)); buf[slot]=b
                      b[s:s+n]=data[pos:pos+n]
                  off+=n; pos+=n
          def read_at(off,length):
              out=bytearray(); pos=0
              while pos<length:
                  slot=off//SLOT; s=off-slot*SLOT; n=min(SLOT-s,length-pos)
                  out+=read_slot(slot)[s:s+n]; off+=n; pos+=n
              return bytes(out)
          class AetherFS(Operations):
              def getattr(self,path,fh=None):
                  if path=="/": return dict(st_mode=(stat.S_IFDIR|0o755),st_nlink=2)
                  if path=="/disk.img": return dict(st_mode=(stat.S_IFREG|0o600),st_nlink=1,st_size=VSIZE,st_blksize=4096,st_blocks=VSIZE//512)
                  raise FuseOSError(errno.ENOENT)
              def readdir(self,path,fh):
                  yield "."; yield ".."; yield "disk.img"
              def open(self,path,flags):
                  if path=="/disk.img": return 0
                  raise FuseOSError(errno.ENOENT)
              def read(self,path,size,offset,fh):
                  if offset>=VSIZE: return b""
                  return read_at(offset,min(size,VSIZE-offset))
              def write(self,path,data,offset,fh):
                  write_at(offset,bytes(data)); return len(data)
              def flush(self,path,fh): return 0
              def fsync(self,path,datasync,fh):
                  drain(); return 0
              def release(self,path,fh):
                  drain(); return 0
              def statfs(self,path):
                  return dict(f_bsize=4096,f_frsize=4096,f_blocks=VSIZE//4096,f_bfree=0,f_bavail=0)
              def truncate(self,path,length,fh=None): return 0
          def on_term(sig,frm):
              threading.Thread(target=lambda:(drain(),os._exit(0))).start()
          signal.signal(signal.SIGTERM,on_term); signal.signal(signal.SIGINT,on_term)
          os.makedirs(MNT,exist_ok=True)
          load_head()
          threading.Thread(target=committer,daemon=True).start()
          log("AETHERCORE_READY", f"MNT:{MNT} VSIZE:{VSIZE} NATIVE:ON")
          FUSE(AetherFS(),MNT,foreground=True,direct_io=True,allow_other=True,nothreads=False)
          PYEOF
          python3 -m py_compile /tmp/aethercore.py
          echo "[LOG] WHAT: AETHERCORE_COMPILED | WHEN: $(date +%s%N)"

      - name: Launch AetherCore + Assert
        run: |
          set -e
          sudo env VSIZE=$VSIZE DRIME_TOKEN=$DRIME nohup python3 /tmp/aethercore.py > /tmp/aethercore.log 2>&1 &
          sleep 10
          cat /tmp/aethercore.log
          grep -q AETHERCORE_READY /tmp/aethercore.log
          mountpoint -q /mnt/aether || { echo "[LOG] WHAT: AETHER_MOUNT_DEAD | WHEN: $(date +%s%N)"; exit 1; }
          ls -l /mnt/aether/disk.img
          echo "[LOG] WHAT: AETHERCORE_ALIVE | WHEN: $(date +%s%N)"

      - name: Probe Disk
        run: |
          set -e
          qemu-img info /mnt/aether/disk.img
          echo "[LOG] WHAT: DISK_PROBE_VERIFIED | WHEN: $(date +%s%N)"

      - name: Boot VM (LOB disk + mirror media, VNC 5900)
        run: |
          if [ -e /dev/kvm ]; then ACC="-accel kvm -cpu host"; else ACC="-accel tcg -cpu max"; fi
          ARGS="-m 8192 -smp 4 $ACC -vnc 0.0.0.0:0 -display none"
          ARGS="$ARGS -drive file=/mnt/aether/disk.img,if=virtio,format=raw,cache=none"
          if [ "$MODE" = "FIRST" ]; then ARGS="$ARGS -boot order=dc -cdrom $CDROM"; else ARGS="$ARGS -boot order=c"; fi
          echo "[LOG] WHAT: VM_START | MODE: $MODE | DISK: LOB-Native | VNC: 0.0.0.0:5900 | WHEN: $(date +%s%N)"
          ( while true; do sleep 300; \
            echo "[LOG] WHAT: HEARTBEAT | MODE: $MODE | WHEN: $(date +%s%N)"; \
            free -h | head -2 || true; \
            echo "[LOG] WHAT: SEGS | N: $(rclone lsf --config /tmp/rclone.conf "${REMOTE}:lob/seg/" 2>/dev/null | wc -l) | WHEN: $(date +%s%N)"; \
          done ) &
          HB=$!
          sudo qemu-system-x86_64 $ARGS &
          QP=$!
          EXIT=0; wait $QP || EXIT=$?
          kill $HB 2>/dev/null || true
          echo "VMEXIT=$EXIT" >> $GITHUB_ENV
          echo "[LOG] WHAT: VM_EXIT | CODE: $EXIT | WHEN: $(date +%s%N)"
          exit $EXIT

      - name: Drain + Unmount (ALWAYS)
        if: always()
        run: |
          echo "[LOG] WHAT: DRAIN_START | WHEN: $(date +%s%N)"
          sudo pkill -TERM -f qemu-system-x86_64 || true
          sleep 3
          sudo pkill -TERM -f aethercore.py || true
          sleep 15
          tail -30 /tmp/aethercore.log || true
          echo "[LOG] WHAT: FINAL_SEGS | N: $(rclone lsf --config /tmp/rclone.conf "${REMOTE}:lob/seg/" 2>/dev/null | wc -l) | WHEN: $(date +%s%N)"
          sudo umount /mnt/aether || sudo fusermount3 -u /mnt/aether || true
          echo "[LOG] WHAT: DRAIN_DONE | WHEN: $(date +%s%N)"
