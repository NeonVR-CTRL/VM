name: AetherGrid AIO (Native Drime v10)

on:
  workflow_dispatch:

jobs:
  boot-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 Hours Hard Limit

    env:
      NB_SK: ${{ secrets.NB_SK }}
      DRIME: ${{ secrets.DRIME }}

    steps:
      - name: Install Minimal Core Stack (Force Clean Rclone)
        run: |
          echo "[LOG] WHAT: STACK_INSTALL | WHICH: Headless QEMU + Clean Rclone | WHEN: $(date +%s%N)"
          sudo apt-get update -y
          
          # CRITICAL FIX: Remove any pre-installed/broken rclone versions first
          sudo apt-get remove -y rclone || true
          
          # Install Minimal QEMU
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            qemu-system-common \
            fuse3 \
            wget \
            curl \
            ca-certificates
          
          # Install the ABSOLUTE LATEST Rclone (Contains the Native Drime Backend)
          curl https://rclone.org/install.sh | sudo bash
          
          # Verify the version to prove it's the new one
          rclone version
          echo "[LOG] WHAT: RCLONE_UPDATED | WHICH: Latest Version with Drime Support | WHEN: $(date +%s%N)"

      - name: Install NetBird
        run: |
          echo "[LOG] WHAT: NETBIRD_INSTALL | WHICH: Official Script | WHEN: $(date +%s%N)"
          curl -fsSL https://pkgs.netbird.io/install.sh | sh

      - name: Initialize NetBird Mesh
        run: |
          echo "[LOG] WHAT: NETBIRD_INIT | WHICH: $NB_SK | WHEN: $(date +%s%N)"
          sudo netbird up --setup-key "$NB_SK" --log-level error &
          sleep 15
          echo "[LOG] WHAT: MESH_READY | WHICH: wt0 | WHEN: $(date +%s%N)"

      - name: Create High-Performance RAM Disk
        run: |
          echo "[LOG] WHAT: RAM_DISK_ALLOC | WHICH: 11GB tmpfs | WHEN: $(date +%s%N)"
          sudo mkdir -p /ramdisk
          sudo mount -t tmpfs -o size=11G tmpfs /ramdisk
          sudo mkdir -p /ramdisk/cache

      - name: Generate Native Drime Config (The Fix)
        run: |
          # CRITICAL FIX: Use 'type = drime' and 'access_token' instead of WebDAV
          cat <<EOF > /tmp/rclone.conf
          [drime]
          type = drime
          access_token = $DRIME
          EOF
          echo "[LOG] WHAT: CONFIG_GENERATED | WHICH: Native Drime Backend | VALUE: REDACTED | WHEN: $(date +%s%N)"

      - name: Mount Drime (Native Protocol)
        run: |
          sudo mkdir -p /mnt/drime
          sudo sed -i 's/#user_allow_other/user_allow_other/' /etc/fuse.conf
          
          # Mount using the Native Backend defined in /tmp/rclone.conf
          sudo rclone mount drime: /mnt/drime \
            --config /tmp/rclone.conf \
            --vfs-cache-mode full \
            --vfs-cache-max-size 7G \
            --cache-dir /ramdisk/cache \
            --allow-other \
            --log-level INFO \
            --daemon
            
          sleep 10
          
          # Verify the mount is ACTUALLY reading data (not a zombie mount)
          if mountpoint -q /mnt/drime && ls -la /mnt/drime > /dev/null 2>&1; then
            echo "[LOG] WHAT: DRIME_MOUNT_SUCCESS | WHICH: /mnt/drime (Verified Active) | WHEN: $(date +%s%N)"
          else
            echo "[LOG] WHAT: DRIME_MOUNT_FAILED | WHY: Auth Failed or Backend Missing | WHEN: $(date +%s%N)"
            # Print logs to help debug if it fails again
            cat /tmp/rclone.conf | grep type
            exit 1
          fi

      - name: Download Ubuntu 26.04 LTS ISO
        run: |
          wget -O /ramdisk/ubuntu.iso "https://releases.ubuntu.com/resolute/ubuntu-26.04-live-server-amd64.iso" || \
          wget -O /ramdisk/ubuntu.iso "https://releases.ubuntu.com/resolute/ubuntu-26.04.1-live-server-amd64.iso"
          echo "[LOG] WHAT: ISO_READY | WHICH: /ramdisk/ubuntu.iso | WHEN: $(date +%s%N)"

      - name: Create Virtual Block Device (QCOW2 on Native Drime)
        run: |
          # Now that the backend is native and verified, QCOW2 creation will succeed
          sudo qemu-img create -f qcow2 /mnt/drime/core.qcow2 8G
          echo "[LOG] WHAT: BLOCK_DEV_CREATED | WHICH: /mnt/drime/core.qcow2 | WHEN: $(date +%s%N)"

      - name: Boot QEMU VM (Aether-Core Mode)
        run: |
          sudo qemu-system-x86_64 \
            -m 3072 \
            -smp 4 \
            -accel kvm -accel tcg \
            -cpu host \
            -boot d \
            -cdrom /ramdisk/ubuntu.iso \
            -drive file=/mnt/drime/core.qcow2,if=virtio,format=qcow2,cache=writeback \
            -vnc 0.0.0.0:0 \
            -display none \
            -daemonize
            
          echo "[LOG] WHAT: VM_BOOTED | WHICH: 0.0.0.0:5900 | WHEN: $(date +%s%N)"

      - name: 6-Hour Keep-Alive & Telemetry
        run: |
          for i in $(seq 1 21600); do
            sleep 1
            if [ $((i % 300)) -eq 0 ]; then
              echo "[LOG] WHAT: HEARTBEAT | WHICH: Uptime $((i/60))m | WHEN: $(date +%s%N)"
              # Verify Drime is still healthy
              ls /mnt/drime > /dev/null 2>&1 || echo "[LOG] WHAT: DRIME_LOST_CONNECTION | WHY: Network/API Drop | WHEN: $(date +%s%N)"
            fi
          done
