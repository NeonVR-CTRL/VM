name: AetherGrid AIO (Flat v42)

on:
  push:
    branches: [main, master]

jobs:
  boot-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      NB_SK:  ${{ secrets.NB_SK }}
      DRIME:  ${{ secrets.DRIME }}
      DRIME1: ${{ secrets.DRIME1 }}
      DRIME2: ${{ secrets.DRIME2 }}
      DRIME3: ${{ secrets.DRIME3 }}
      FORCE: "true"

    steps:
      - name: Install Minimal Stack
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils qemu-system-common qemu-block-extra fuse3 libfuse2 wget curl ca-certificates python3 python3-pip
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          sudo pip3 install --break-system-packages fusepy requests
          echo "[LOG] WHAT: INSTALL_DONE | WHEN: $(date +%s%N)"

      - name: NetBird Mesh Up
        run: |
          set -e
          sudo netbird up --setup-key "$NB_SK" --log-level error &
          sleep 15
          echo "[LOG] WHAT: NETBIRD_UP | WHEN: $(date +%s%N)"

      - name: Write AetherGrid v42 (Flat, Instant-Durable)
        run: |
          cat > /tmp/aethergrid.py <<'PYEOF'
          import os,stat,errno,zlib,json,threading,time,signal,traceback
          from collections import OrderedDict
          from concurrent.futures import ThreadPoolExecutor
          import requests
          from fuse import FUSE, FuseOSError, Operations
          TOKEN=os.environ["DRIME"]
          VSIZE=int(os.environ.get("VSIZE","18"))*1024**3
          FORCE=os.environ.get("FORCE","true")=="true"
          MNT="/mnt/aether"; API="https://app.drime.cloud/api/v1"; BASE="https://app.drime.cloud/"
          SLOT=256*1024; PART=5*1024*1024; SEGLRU_MAX=64; CKPT_EVERY=2.0
          S=requests.Session(); S.headers.update({"Authorization":"Bearer "+TOKEN,"Accept":"application/json"})
          pool=ThreadPoolExecutor(8)
          lock=threading.Lock(); commit_req=threading.Event(); commit_done=threading.Event()
          index={}; buf={}; segseq=[0]; idxseq=[0]; seglru=OrderedDict(); segurl={}; last_ckpt=[0.0]
          def log(w,v): print(f"[LOG] WHAT: {w} | {v} | WHEN: {time.time_ns()}",flush=True)
          def walk(o):
              st=[o]
              while st:
                  c=st.pop()
                  if isinstance(c,dict): yield c; st.extend(c.values())
                  elif isinstance(c,list): st.extend(c)
          def find_items(o):
              st=[o]
              while st:
                  c=st.pop()
                  if isinstance(c,list) and c and all(isinstance(x,dict) and "id" in x and "name" in x for x in c): return c
                  if isinstance(c,dict): st.extend(c.values())
                  elif isinstance(c,list): st.extend(c)
              return []
          def dig(o,*keys):
              for d in walk(o):
                  for kk,vv in d.items():
                      if kk.lower() in keys: return vv
              return None
          def digurl(o):
              for d in walk(o):
                  for kk,vv in d.items():
                      if isinstance(vv,str) and ("url" in kk.lower() or kk.lower()=="link") and (vv.startswith("/") or vv.startswith("http")): return vv
              return None
          def list_root():
              out=[]; page=1
              while True:
                  r=S.get(API+"/drive/file-entries",params={"perPage":200,"page":page},timeout=60)
                  r.raise_for_status(); items=find_items(r.json()); out+=items
                  if len(items)<200: break
                  page+=1
              return out
          def get_file_url(fid):
              r=S.get(API+f"/file-entries/{fid}",timeout=60); r.raise_for_status()
              return digurl(r.json())
          def mp_create(fname):
              bodies=[{"Filename":fname,"Mime":"application/octet-stream","Size":0,"Extension":"bin","RelativePath":fname},
                      {"Filename":fname,"Mime":"application/octet-stream","Size":0,"Extension":"bin","RelativePath":fname,"ParentID":None},
                      {"Filename":fname,"Mime":"application/octet-stream","Size":0,"Extension":"bin","RelativePath":fname,"ParentID":0}]
              last=None
              for b in bodies:
                  r=S.post(API+"/s3/multipart/create",json=b,timeout=60); last=r
                  if r.status_code in (200,201): break
              last.raise_for_status(); j=last.json()
              return str(dig(j,"uploadid","upload_id")), str(dig(j,"key"))
          def mp_sign(up,key,nums):
              r=S.post(API+"/s3/multipart/batch-sign-part-urls",json={"UploadID":up,"Key":key,"PartNumbers":nums},timeout=60)
              r.raise_for_status(); m={}
              for d in walk(r.json()):
                  pn=None; url=None
                  for k,v in d.items():
                      if isinstance(v,int) and "part" in k.lower(): pn=v
                      if isinstance(v,str) and v.startswith("http"): url=v
                  if pn is not None and url: m[pn]=url
              return m
          def mp_complete(up,key,parts):
              r=S.post(API+"/s3/multipart/complete",json={"UploadID":up,"Key":key,"Parts":parts},timeout=120)
              r.raise_for_status(); return digurl(r.json())
          def upload_blob(name,data):
              up,key=mp_create(name)
              n=max(1,(len(data)+PART-1)//PART)
              urls=mp_sign(up,key,list(range(1,n+1)))
              def do(pn):
                  r=requests.put(urls[pn],data=data[(pn-1)*PART:pn*PART],headers={"Content-Type":"application/octet-stream"},timeout=120)
                  r.raise_for_status(); return {"PartNumber":pn,"ETag":r.headers.get("ETag","")}
              futs=[pool.submit(do,pn) for pn in range(1,n+1)]
              parts=sorted((f.result() for f in futs),key=lambda p:p["PartNumber"])
              return mp_complete(up,key,parts)
          def hard_delete(fid):
              r=S.post(API+"/file-entries/delete",json={"EntryIDs":[str(fid)],"DeleteForever":True},timeout=60)
              return r.status_code
          def wipe():
              n=0
              for it in list_root():
                  nm=it.get("name","")
                  if nm.startswith("aeg-"):
                      hard_delete(it["id"]); n+=1
              log("WIPE", f"deleted {n} old objects")
          def checkpoint():
              with lock:
                  idxseq[0]+=1; s=idxseq[0]
                  snap={"index":dict(index),"segseq":segseq[0],"segurls":dict(segurl)}
              rawb=zlib.compress(json.dumps(snap).encode(),6)
              upload_blob(f"aeg-i{s:08d}.idx",rawb)
              last_ckpt[0]=time.time()
          def commit():
              with lock:
                  slots=list(buf.keys())
                  if not slots: return False
                  table={}; chunks=[]; off=0
                  for s in slots:
                      c=zlib.compress(bytes(buf[s]),1); table[s]=[off,len(c)]; chunks.append(c); off+=len(c)
                  buf.clear()
                  segseq[0]+=1; seq=segseq[0]
                  for s in slots: index[str(s)]=f"{seq}:{table[s][0]}:{table[s][1]}"
              body=json.dumps(table).encode()
              payload=len(body).to_bytes(4,"big")+body+b"".join(chunks)
              u=upload_blob(f"aeg-s{seq:08d}.bin",payload)
              with lock: segurl[str(seq)]=u or ""
              if time.time()-last_ckpt[0]>=CKPT_EVERY: checkpoint()
              return True
          def committer():
              while True:
                  commit_req.wait(CKPT_EVERY)
                  commit_req.clear()
                  try:
                      commit()
                      with lock: need=len(buf)==0
                      if time.time()-last_ckpt[0]>=CKPT_EVERY: checkpoint()
                  except Exception: traceback.print_exc()
                  commit_done.set()
          def drain_sync():
              with lock: need=len(buf)>0
              if not need: return
              commit_done.clear(); commit_req.set(); commit_done.wait(120)
          def seg_payload(seq):
              with lock:
                  if seq in seglru: seglru.move_to_end(seq); return seglru[seq]
                  u=segurl.get(str(seq),"")
              if not u:
                  nm=f"aeg-s{seq:08d}.bin"
                  it=[x for x in list_root() if x.get("name")==nm]
                  if not it: raise FuseOSError(errno.EIO)
                  u=it[0].get("url") or get_file_url(it[0]["id"]) or ""
                  with lock: segurl[str(seq)]=u
              r=S.get(BASE+u if u.startswith("/") else u,timeout=120); r.raise_for_status()
              d=r.content
              with lock:
                  seglru[seq]=d; seglru.move_to_end(seq)
                  while len(seglru)>SEGLRU_MAX: seglru.popitem(last=False)
              return d
          def parse_seg(payload):
              ln=int.from_bytes(payload[:4],"big"); table=json.loads(payload[4:4+ln]); return table,payload[4+ln:]
          def load_head():
              idxs=sorted((x for x in list_root() if x.get("name","").startswith("aeg-i")),key=lambda x:x["name"])
              if not idxs: log("HEAD_LOADED","EMPTY"); return
              it=idxs[-1]; idxseq[0]=int(it["name"][5:13])
              u=it.get("url") or get_file_url(it["id"])
              r=S.get(BASE+u if u.startswith("/") else u,timeout=120); r.raise_for_status()
              d=json.loads(zlib.decompress(r.content))
              index.update(d["index"]); segseq[0]=d.get("segseq",0)
              for k,v in d.get("segurls",{}).items(): segurl[k]=v
              for x in list_root():
                  nm=x.get("name","")
                  if nm.startswith("aeg-s"):
                      sq=int(nm[5:13])
                      if sq>segseq[0]:
                          try:
                              uu=x.get("url") or get_file_url(x["id"])
                              rr=S.get(BASE+uu if uu.startswith("/") else uu,timeout=120); rr.raise_for_status()
                              table,body=parse_seg(rr.content)
                              for s,(o,l) in table.items(): index[str(s)]=f"{sq}:{o}:{l}"
                              with lock: segurl[str(sq)]=uu or ""
                              segseq[0]=sq
                          except Exception: traceback.print_exc()
              log("HEAD_LOADED", f"IDX:{idxseq[0]} SEG:{segseq[0]} SLOTS:{len(index)}")
          def read_slot(slot):
              with lock:
                  if slot in buf: return bytes(buf[slot])
                  ptr=index.get(str(slot))
                  if ptr is None: return b"\x00"*SLOT
              seq,off,ln=map(int,ptr.split(":"))
              table,body=parse_seg(seg_payload(seq))
              return zlib.decompress(body[off:off+ln])
          def write_at(off,data):
              pos=0
              while pos<len(data):
                  slot=off//SLOT; s=off-slot*SLOT; n=min(SLOT-s,len(data)-pos)
                  with lock:
                      b=buf.get(slot)
                      if b is None:
                          b=bytearray(read_slot(slot)); buf[slot]=b
                      b[s:s+n]=data[pos:pos+n]
                  off+=n; pos+=n
          def read_at(off,length):
              out=bytearray(); pos=0
              while pos<length:
                  slot=off//SLOT; s=off-slot*SLOT; n=min(SLOT-s,length-pos)
                  out+=read_slot(slot)[s:s+n]; off+=n; pos+=n
              return bytes(out)
          class AetherFS(Operations):
              def getattr(self,path,fh=None):
                  if path=="/": return dict(st_mode=(stat.S_IFDIR|0o755),st_nlink=2)
                  if path=="/disk.img": return dict(st_mode=(stat.S_IFREG|0o600),st_nlink=1,st_size=VSIZE,st_blksize=4096,st_blocks=VSIZE//512)
                  raise FuseOSError(errno.ENOENT)
              def readdir(self,path,fh):
                  yield "."; yield ".."; yield "disk.img"
              def open(self,path,flags):
                  if path=="/disk.img": return 0
                  raise FuseOSError(errno.ENOENT)
              def read(self,path,size,offset,fh):
                  if offset>=VSIZE: return b""
                  return read_at(offset,min(size,VSIZE-offset))
              def write(self,path,data,offset,fh):
                  write_at(offset,bytes(data)); return len(data)
              def flush(self,path,fh): return 0
              def fsync(self,path,datasync,fh):
                  drain_sync(); return 0
              def release(self,path,fh): return 0
              def statfs(self,path):
                  return dict(f_bsize=4096,f_frsize=4096,f_blocks=VSIZE//4096,f_bfree=0,f_bavail=0)
              def truncate(self,path,length,fh=None): return 0
          def on_term(sig,frm):
              threading.Thread(target=lambda:(commit(),os._exit(0))).start()
          signal.signal(signal.SIGTERM,on_term); signal.signal(signal.SIGINT,on_term)
          if FORCE: wipe()
          os.makedirs(MNT,exist_ok=True)
          load_head()
          threading.Thread(target=committer,daemon=True).start()
          log("AETHERCORE_READY", f"MNT:{MNT} VSIZE:{VSIZE} FLAT:ON INSTANT_DURABLE:ON")
          FUSE(AetherFS(),MNT,foreground=True,direct_io=True,allow_other=True,nothreads=False)
          PYEOF
          python3 -m py_compile /tmp/aethergrid.py
          echo "[LOG] WHAT: COMPILED | WHEN: $(date +%s%N)"

      - name: Detect Mode
        run: |
          set -e
          if [ "$FORCE" = "true" ]; then echo "MODE=FIRST" >> $GITHUB_ENV; else
          sudo env DRIME=$DRIME python3 -c "
          import requests,os
          S=requests.Session(); S.headers.update({'Authorization':'Bearer '+os.environ['DRIME'],'Accept':'application/json'})
          r=S.get('https://app.drime.cloud/api/v1/drive/file-entries',params={'perPage':200},timeout=60)
          items=[i for i in r.json().get('data',[]) if str(i.get('name','')).startswith('aeg-i')]
          print('MODE=BOOT' if items else 'MODE=FIRST')
          " >> $GITHUB_ENV; fi
          echo "VSIZE=18" >> $GITHUB_ENV

      - name: Resolve Media
        if: env.MODE == 'FIRST'
        run: |
          set -e
          ISO_URL=""
          for u in "https://releases.ubuntu.com/resolute/ubuntu-26.04.1-live-server-amd64.iso" \
                   "https://releases.ubuntu.com/resolute/ubuntu-26.04-live-server-amd64.iso"; do
            if curl -sfI "$u" | head -1 | grep -qE "HTTP/[^ ]+ (200|302)"; then ISO_URL=$u; break; fi
          done
          [ -n "$ISO_URL" ] || exit 1
          echo "CDROM=$ISO_URL" >> $GITHUB_ENV

      - name: Launch AetherGrid
        run: |
          set -e
          sudo env VSIZE=$VSIZE DRIME=$DRIME FORCE=$FORCE nohup python3 /tmp/aethergrid.py > /tmp/aethergrid.log 2>&1 &
          sleep 10
          cat /tmp/aethergrid.log
          grep -q AETHERCORE_READY /tmp/aethergrid.log
          mountpoint -q /mnt/aether || exit 1
          ls -l /mnt/aether/disk.img
          echo "[LOG] WHAT: ALIVE | WHEN: $(date +%s%N)"

      - name: Boot VM (VNC 5900)
        run: |
          if [ -e /dev/kvm ]; then ACC="-accel kvm -cpu host"; else ACC="-accel tcg -cpu max"; fi
          ARGS="-m 8192 -smp 4 $ACC -vnc 0.0.0.0:0 -display none"
          ARGS="$ARGS -drive file=/mnt/aether/disk.img,if=virtio,format=raw,cache=none"
          if [ "$MODE" = "FIRST" ]; then ARGS="$ARGS -boot order=dc -cdrom $CDROM"; else ARGS="$ARGS -boot order=c"; fi
          echo "[LOG] WHAT: VM_START | MODE: $MODE | WHEN: $(date +%s%N)"
          ( while true; do sleep 300; \
            echo "[LOG] WHAT: HEARTBEAT | WHEN: $(date +%s%N)"; free -h | head -2; \
            tail -3 /tmp/aethergrid.log; \
          done ) &
          sudo qemu-system-x86_64 $ARGS &
          QP=$!
          EXIT=0; wait $QP || EXIT=$?
          echo "[LOG] WHAT: VM_EXIT | CODE: $EXIT | WHEN: $(date +%s%N)"
          exit $EXIT
